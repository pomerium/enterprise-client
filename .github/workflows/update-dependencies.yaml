name: Update Dependencies

on:
  schedule:
    - cron: "40 1 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Create CI token
        id: ci-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ secrets.POMERIUM_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.POMERIUM_CI_APP_PRIVATE_KEY }}
          owner: pomerium
          repositories: enterprise-client,pomerium-console
          permission-contents: read

      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          submodules: "true"
          token: ${{ steps.ci-token.outputs.token }}

      - name: Update Pomerium Dependencies
        run: ./scripts/update-dependencies pomerium

      - name: Generate
        run: make generate

      - name: Check for Changes
        id: git-diff
        run: |
          git config --global user.email "346165314+pomerium-ci-bot[bot]@users.noreply.github.com"
          git config --global user.name "pomerium-ci-bot[bot]"
          git add .
          git diff --cached --exit-code || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Create CI write token
        id: ci-write-token
        if: ${{ steps.git-diff.outputs.changed }} == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ secrets.POMERIUM_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.POMERIUM_CI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Create Pull Request
        if: ${{ steps.git-diff.outputs.changed }} == 'true'
        uses: peter-evans/create-pull-request@84ae59a2cdc2258d6fa0732dd66352dddae2a412
        with:
          author: pomerium-ci-bot[bot] <346165314+pomerium-ci-bot[bot]@users.noreply.github.com>
          body: "This PR updates dependencies not managed by dependabot."
          branch: ci/update-core
          commit-message: "ci: update dependencies"
          delete-branch: true
          labels: ci
          title: "ci: update dependencies"
          token: ${{ steps.ci-write-token.outputs.token }}
